[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "itol-workflow-cli"
version = "0.1.0"
description = "Reproducible annotation, packaging and official batch access for iTOL"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
itol = "itol_cli.cli:main"

[tool.setuptools.packages.find]
include = ["itol_cli*"]
